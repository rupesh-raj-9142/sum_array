<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Summation of Array Elements</title>
</head>
<body>

    <h2>Summation of Array Elements</h2>
    <p id="output"></p>

    <script>
        let numbers = [10, 20, 30, 40, 50];

        let sum = 0;
        
        for (let i = 0; i < numbers.length; i++) {
            sum = sum + numbers[i];
        }


        document.getElementById("output").innerHTML =
            "Sum of array elements = " + sum;
    </script>

</body>
</html>
